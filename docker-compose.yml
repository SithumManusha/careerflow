version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: careerflow-postgres
    environment:
      POSTGRES_DB: careerflow_db
      POSTGRES_USER: careerflow_user
      POSTGRES_PASSWORD: careerflow_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerflow_user -d careerflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - careerflow-network

  redis:
    image: redis:7-alpine
    container_name: careerflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - careerflow-network

  worker-python:
    build:
      context: ./worker-python
      dockerfile: Dockerfile
    container_name: careerflow-python-worker
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-demo-key}
    networks:
      - careerflow-network

  backend-java:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: careerflow-java-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/careerflow_db
      - SPRING_DATASOURCE_USERNAME=careerflow_user
      - SPRING_DATASOURCE_PASSWORD=careerflow_password
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - WORKER_PYTHON_URL=http://worker-python:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker-python:
        condition: service_started
    networks:
      - careerflow-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careerflow-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://backend-java:8080
      - NEXT_PUBLIC_WORKER_URL=http://worker-python:8000
    depends_on:
      - backend-java
    networks:
      - careerflow-network

volumes:
  postgres_data:

networks:
  careerflow-network:
    driver: bridge
