apiVersion: v1
kind: Namespace
metadata:
  name: careerflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: careerflow-config
  namespace: careerflow
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-service:5432/careerflow_db
  SPRING_DATA_REDIS_HOST: redis-service
  SPRING_DATA_REDIS_PORT: 6379
  WORKER_PYTHON_URL: http://worker-python-service:8000
  NEXT_PUBLIC_BACKEND_URL: http://backend-java-service:8080
  NEXT_PUBLIC_WORKER_URL: http://worker-python-service:8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: careerflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: careerflow_db
            - name: POSTGRES_USER
              value: careerflow_user
            - name: POSTGRES_PASSWORD
              value: careerflow_password
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: careerflow
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: careerflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 250m
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: careerflow
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-python
  namespace: careerflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker-python
  template:
    metadata:
      labels:
        app: worker-python
    spec:
      containers:
        - name: worker-python
          image: careerflow/worker-python:latest
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: 8000
          resources:
            requests:
              memory: 256Mi
              cpu: 200m
            limits:
              memory: 512Mi
              cpu: 1000m
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: worker-python-service
  namespace: careerflow
spec:
  selector:
    app: worker-python
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-java
  namespace: careerflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-java
  template:
    metadata:
      labels:
        app: backend-java
    spec:
      containers:
        - name: backend-java
          image: careerflow/backend-java:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: careerflow-config
          env:
            - name: SPRING_DATASOURCE_USERNAME
              value: careerflow_user
            - name: SPRING_DATASOURCE_PASSWORD
              value: careerflow_password
          resources:
            requests:
              memory: 512Mi
              cpu: 300m
            limits:
              memory: 1024Mi
              cpu: 1500m
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend-java-service
  namespace: careerflow
spec:
  selector:
    app: backend-java
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: careerflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: careerflow/frontend:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: careerflow-config
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: careerflow
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 3000
