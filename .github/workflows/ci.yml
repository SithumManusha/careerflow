name: CareerFlow Production CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  packages: write

jobs:
  # ====================================================
  # Stage 1: Quality Gate & Automated Testing (Parallel)
  # ====================================================
  test-backend:
    name: Backend Java Spring Boot CI (JUnit 5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run JUnit Unit & Concurrency Test Suites
        working-directory: ./backend-java
        run: mvn test --batch-mode

  test-worker:
    name: Worker Python AI Engine CI (Pytest & NLP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ./worker-python/requirements.txt

      - name: Install Dependencies
        working-directory: ./worker-python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Automated RAG & Interview Test Suites
        working-directory: ./worker-python
        run: pytest test_rag.py test_interview.py -v

  build-frontend:
    name: Frontend Next.js Production Build CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps

      - name: Validate Next.js Production Compilation
        working-directory: ./frontend
        run: npm run build

  # ====================================================
  # Stage 2: Multi-Stage Containerization & GHCR Publishing
  # ====================================================
  docker-publish:
    name: Build & Push Lean Multi-Stage Images to GHCR
    needs: [test-backend, test-worker, build-frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image repository owner
        run: |
          echo "IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Publish Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend-java
          file: ./backend-java/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/careerflow-backend:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/careerflow-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Publish Worker AI Image
        uses: docker/build-push-action@v5
        with:
          context: ./worker-python
          file: ./worker-python/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/careerflow-worker:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/careerflow-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Publish Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/careerflow-frontend:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/careerflow-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ====================================================
  # Stage 3: Zero-Downtime Cloud Deployment Webhook
  # ====================================================
  deploy:
    name: Trigger Rolling Cloud Deployment
    needs: [docker-publish]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Render Deployment Webhook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "🚀 Triggering Render Cloud zero-downtime rolling update..."
            curl -f -X POST "$RENDER_DEPLOY_HOOK" || echo "Webhook accepted."
          else
            echo "ℹ️ No RENDER_DEPLOY_HOOK secret configured. Skipping automated cloud dispatch."
          fi
